# Tracks the stable channel's latest CSV (Automatic install-plan approval, no startingCSV
# pin) — used instead of subscription.yaml's pinned v1.4.0 once the cluster's RHOAI version
# is confirmed compatible with newer COO releases (RHOAI 3.4.3+; see install_coo() in
# ../../../setup.sh for the version check and the regression this avoids on older RHOAI).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
spec:
  channel: stable
  installPlanApproval: Automatic
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
