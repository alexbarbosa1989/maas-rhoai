# Pinned to v1.4.0 with Manual install-plan approval (matches the upstream
# rh-aiservices-bu/rhoai-maas-guide companion repo's Phase 7) to avoid potential
# regressions in newer COO releases. install_coo() in setup.sh approves the
# resulting InstallPlan automatically via approve_installplan_for_sub.
#
# Only used on RHOAI < 3.5.0 — the pin is needed for the entire 3.4.x line.
# install_coo() switches to subscription-latest.yaml (stable channel, Automatic
# approval) on RHOAI 3.5.0+, where the regression this pin works around is fixed.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
spec:
  channel: stable
  installPlanApproval: Manual
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: cluster-observability-operator.v1.4.0
