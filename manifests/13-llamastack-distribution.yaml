# LlamaStack Distribution for the RHOAI GenAI Playground
#
# The dashboard's GenAI Playground connects to a LlamaStackDistribution,
# not directly to the LLMInferenceService. This manifest creates both
# the ConfigMap and the LlamaStackDistribution CR.
#
# Spec mirrors the working lsd-genai-playground created via the dashboard
# on a ROSA HCP cluster running RHOAI 3.4 / LlamaStack 0.7.2+rhaiv.0.
#
# Prerequisites:
#   - LLMInferenceService llama-3-8b must be Ready in maas-models
#   - namespace maas-models must exist (created by setup-maas.sh)
#
# Apply after 08-example-llminferenceservice.yaml is Ready:
#   oc apply -f manifests/13-llamastack-distribution.yaml
#
# Verify:
#   oc get llamastackdistribution lsd-genai-playground -n maas-models
#   oc logs -n maas-models -l app=lsd-genai-playground --tail=30
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-stack-config
  namespace: maas-models
  labels:
    opendatahub.io/dashboard: "true"
data:
  config.yaml: |
    # Llama Stack Configuration
    version: "2"
    distro_name: rh
    apis:
    - responses
    - datasetio
    - files
    - inference
    - safety
    - scoring
    - tool_runtime
    - vector_io
    providers:
      inference:
      - provider_id: sentence-transformers
        provider_type: inline::sentence-transformers
        config: {}
      - provider_id: vllm-inference-1
        provider_type: remote::vllm
        config:
          api_token: ${env.VLLM_API_TOKEN_1:=fake}
          base_url: https://llama-3-8b-kserve-workload-svc.maas-models.svc.cluster.local:8000/v1
          max_tokens: ${env.VLLM_MAX_TOKENS:=4096}
          tls_verify: ${env.VLLM_TLS_VERIFY:=true}
      vector_io:
      - provider_id: milvus
        provider_type: inline::milvus
        config:
          db_path: /opt/app-root/src/.llama/distributions/rh/milvus.db
          persistence:
            backend: kv_default
            namespace: vector_io::milvus
      responses:
      - provider_id: builtin
        provider_type: inline::builtin
        config:
          persistence:
            agent_state:
              backend: kv_default
              namespace: agents
            responses:
              backend: sql_default
              max_write_queue_size: 10000
              num_writers: 4
              table_name: responses
      eval: []
      files:
      - provider_id: meta-reference-files
        provider_type: inline::localfs
        config:
          metadata_store:
            backend: sql_default
            table_name: files_metadata
          storage_dir: /opt/app-root/src/.llama/distributions/rh/files
      datasetio:
      - provider_id: huggingface
        provider_type: remote::huggingface
        config:
          kvstore:
            backend: kv_default
            namespace: datasetio::huggingface
      scoring:
      - provider_id: basic
        provider_type: inline::basic
        config: {}
      - provider_id: llm-as-judge
        provider_type: inline::llm-as-judge
        config: {}
      tool_runtime:
      - provider_id: file-search
        provider_type: inline::file-search
        config: {}
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
        config: {}
      safety: []
    metadata_store:
      type: sqlite
      db_path: /opt/app-root/src/.llama/distributions/rh/inference_store.db
    storage:
      backends:
        kv_default:
          db_path: /opt/app-root/src/.llama/distributions/rh/kvstore.db
          type: kv_sqlite
        sql_default:
          db_path: /opt/app-root/src/.llama/distributions/rh/sql_store.db
          type: sql_sqlite
      stores:
        conversations:
          backend: sql_default
          table_name: openai_conversations
        inference:
          backend: sql_default
          table_name: inference_store
        metadata:
          backend: kv_default
          namespace: registry
    vector_stores:
      default_provider_id: milvus
      default_embedding_model:
        provider_id: sentence-transformers
        model_id: ibm-granite/granite-embedding-125m-english
    registered_resources:
      models:
      - provider_id: sentence-transformers
        model_id: sentence-transformers/ibm-granite/granite-embedding-125m-english
        provider_model_id: ibm-granite/granite-embedding-125m-english
        model_type: embedding
        metadata:
          embedding_dimension: 768
      - provider_id: vllm-inference-1
        model_id: llama-3-8b
        model_type: llm
        metadata: {}
      shields: []
      vector_stores: []
      datasets: []
      scoring_fns: []
      benchmarks: []
    server:
      port: 8321
---
apiVersion: llamastack.io/v1alpha1
kind: LlamaStackDistribution
metadata:
  name: lsd-genai-playground
  namespace: maas-models
  annotations:
    openshift.io/display-name: lsd-genai-playground
  labels:
    opendatahub.io/dashboard: "true"
spec:
  replicas: 1
  server:
    distribution:
      name: rh-dev
    containerSpec:
      name: llama-stack
      command:
      - /bin/sh
      - -c
      - llama stack run /etc/llama-stack/config.yaml
      port: 8321
      env:
      - name: VLLM_TLS_VERIFY
        value: "false"
      - name: VLLM_API_TOKEN_1
        value: fake
      - name: VLLM_MAX_TOKENS
        value: "4096"
      - name: MILVUS_DB_PATH
        value: ~/.llama/milvus.db
      - name: FMS_ORCHESTRATOR_URL
        value: http://localhost
      - name: LLAMA_STACK_CONFIG_DIR
        value: /opt/app-root/src/.llama/distributions/rh/
      resources:
        requests:
          cpu: 250m
          memory: 500Mi
        limits:
          cpu: "2"
          memory: 12Gi
    userConfig:
      configMapName: llama-stack-config
    storage:
      size: 2Gi
      mountPath: /opt/app-root/src/.llama
  network:
    exposeRoute: false
    allowedFrom:
      namespaces:
      - "*"
