# Grant a group (e.g. data scientists) read access to LLMInferenceServices in maas-models.
# This satisfies the AuthPolicy's SubjectAccessReview check.
# Replace "maas-users" with your actual group name from the OpenShift identity provider.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-model-viewers
  namespace: maas-models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: Group
  name: maas-users          # replace with your OIDC/LDAP group name
  apiGroup: rbac.authorization.k8s.io
