# Authorino TLS setup.
# MaaS requires Authorino to run with TLS enabled on its gRPC listener.
# Uses cert-manager (already installed) with a self-signed ClusterIssuer.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: maas-self-signed
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authorino-tls
  namespace: kuadrant-system
spec:
  secretName: authorino-tls-secret
  issuerRef:
    name: maas-self-signed
    kind: ClusterIssuer
  commonName: authorino.kuadrant-system.svc
  dnsNames:
  - authorino.kuadrant-system.svc
  - authorino.kuadrant-system.svc.cluster.local
  duration: 8760h   # 1 year
  renewBefore: 720h # renew 30 days before expiry
