# TokenRateLimitPolicy — enforces LLM token-level quotas per user.
# Requires the serving runtime to emit token-usage in response headers.
# This is specific to RHCL v1.4+ and is designed for LLM workloads.
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: llama-3-8b-token-quota
  namespace: maas-models
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llama-3-8b
  limits:
    per-user-daily-tokens:
      rates:
      - limit: 100000       # 100k tokens per day per user
        window: 24h
      counters:
      - expression: auth.identity.user.username
      tokenUsage:
        completionTokens:
          headerName: x-completion-tokens
        promptTokens:
          headerName: x-prompt-tokens
