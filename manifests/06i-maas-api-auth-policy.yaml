# AuthPolicy for the MaaS management API (maas-api-route HTTPRoute).
#
# The maas-controller should auto-create this policy but does not in some
# RHOAI 3.4 deployments. Without it:
#   - maas-api returns 500 "Missing or empty username header" (X-MaaS-Username)
#   - The dashboard "Error loading components" error is shown
#
# Handles two authentication paths:
#   1. API key auth:  Authorization: Bearer sk-oai-<key>
#                     → validates key via maas-api /internal/v1/api-keys/validate
#                     → injects X-MaaS-Username from validation response
#   2. OCP token auth: Authorization: Bearer <oc-token>
#                     → Kubernetes TokenReview
#                     → injects X-MaaS-Username from auth.identity.user.username
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: maas-api-auth-policy
  namespace: redhat-ods-applications
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: maas-api-route
  when:
  - predicate: 'request.path != "/maas-api/health" || request.method != "GET"'
  rules:
    authentication:
      api-keys:
        when:
        - selector: request.headers.authorization
          operator: matches
          value: "^Bearer sk-oai-.*"
        plain:
          selector: request.headers.authorization
        priority: 0
      openshift-identities:
        when:
        - predicate: '!request.headers.authorization.startsWith("Bearer sk-oai-")'
        kubernetesTokenReview:
          audiences:
          - https://kubernetes.default.svc
        priority: 1
    metadata:
      apiKeyValidation:
        when:
        - selector: request.headers.authorization
          operator: matches
          value: "^Bearer sk-oai-.*"
        http:
          url: https://maas-api.redhat-ods-applications.svc.cluster.local:8443/internal/v1/api-keys/validate
          method: POST
          contentType: application/json
          body:
            expression: '{"key": request.headers.authorization.replace("Bearer ", "")}'
        priority: 0
    authorization:
      api-key-valid:
        when:
        - selector: request.headers.authorization
          operator: matches
          value: "^Bearer sk-oai-.*"
        patternMatching:
          patterns:
          - selector: auth.metadata.apiKeyValidation.valid
            operator: eq
            value: "true"
        priority: 0
    response:
      success:
        headers:
          X-MaaS-Username-APIKey:
            when:
            - selector: request.headers.authorization
              operator: matches
              value: "^Bearer sk-oai-.*"
            plain:
              selector: auth.metadata.apiKeyValidation.username
            key: X-MaaS-Username
            priority: 0
          X-MaaS-Username-OC:
            when:
            - predicate: '!request.headers.authorization.startsWith("Bearer sk-oai-")'
            plain:
              selector: auth.identity.user.username
            key: X-MaaS-Username
            priority: 1
          X-MaaS-Group-APIKey:
            when:
            - selector: request.headers.authorization
              operator: matches
              value: "^Bearer sk-oai-.*"
            plain:
              selector: auth.metadata.apiKeyValidation.groups.@tostr
            key: X-MaaS-Group
            priority: 0
          X-MaaS-Group-OC:
            when:
            - predicate: '!request.headers.authorization.startsWith("Bearer sk-oai-")'
            plain:
              selector: auth.identity.user.groups.@tostr
            key: X-MaaS-Group
            priority: 1
