# OGXServer for the RHOAI GenAI Playground (RHOAI 3.5+, replaces LlamaStackDistribution)
#
# The dashboard's GenAI Playground connects to an OGXServer, not directly to the
# LLMInferenceService. This is the OGX analog of manifests/13-llamastack-distribution.yaml,
# translated per ogx-migration.md's confirmed field mapping: API group/kind/version,
# container run command, env var renames (LLAMA_STACK_CONFIG_DIR -> OGX_CONFIG_DIR),
# mount-path renames (/.llama -> /.ogx), and the ogx.io/watch ConfigMap label.
#
# The OGXServer spec below (distribution/network/overrideConfig/workload shape, the
# `ogx run /etc/ogx/config.yaml --insecure` command, and the VLLM_MAX_TOKENS_1 env var
# name) is copied verbatim from a live, working OGXServer inspected on a CRC cluster
# running RHOAI 3.5.0 (created via the dashboard's "Create playground" flow) — not
# guessed from docs.
#
# NOT reproduced here: the pgvector-backed RAG vector store that the RHOAI 3.5 dashboard
# auto-provisions alongside a dashboard-created Playground (observed live as a companion
# genai-pgvector Deployment/Service/Secret/PVC, owned by the OGXServer, wired in via
# PGVECTOR_* env vars). That behavior's trigger and its config.yaml vector_io schema were
# never captured verbatim from a live cluster, so this manifest keeps the original
# config's self-contained inline::milvus vector store instead — verified working, no
# external DB dependency. If you need the pgvector-backed RAG store, create a Playground
# via the dashboard once and diff its generated OGXServer/ConfigMap against this file.
#
# Prerequisites:
#   - LLMInferenceService llama-3-8b must be Ready in maas-models
#   - namespace maas-models must exist (created by setup-maas.sh)
#
# Apply after 08-example-llminferenceservice.yaml is Ready:
#   oc apply -f manifests/14-ogx-server.yaml
#
# Verify:
#   oc get ogxserver lsd-genai-playground -n maas-models
#   oc logs -n maas-models -l app.kubernetes.io/instance=lsd-genai-playground --tail=30
#
# Remove (or use ./remove-ogx-playground.sh maas-models for a full sweep):
#   oc delete -f manifests/14-ogx-server.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-stack-config
  namespace: maas-models
  labels:
    opendatahub.io/dashboard: "true"
    ogx.io/watch: "true"
data:
  config.yaml: |
    # OGX Server Configuration
    version: "2"
    distro_name: rh
    # apis: trimmed to what this OGX build's Api enum actually recognizes — confirmed
    # live via `python3 -c "import ogx_api.datatypes as d; print([e.value for e in d.Api])"`
    # inside the running ogx image. "datasetio", "safety", "scoring", and "eval" (all
    # present in the old LlamaStack config this was translated from) are NOT in that
    # enum and crash the server at startup with e.g. "API 'datasetio' does not exist."
    apis:
    - responses
    - files
    - inference
    - tool_runtime
    - vector_io
    providers:
      inference:
      - provider_id: sentence-transformers
        provider_type: inline::sentence-transformers
        config: {}
      - provider_id: vllm-inference-1
        provider_type: remote::vllm
        config:
          api_token: ${env.VLLM_API_TOKEN_1:=fake}
          base_url: https://llama-3-8b-kserve-workload-svc.maas-models.svc.cluster.local:8000/v1
          max_tokens: ${env.VLLM_MAX_TOKENS_1:=4096}
          tls_verify: ${env.VLLM_TLS_VERIFY:=true}
      vector_io:
      - provider_id: milvus
        provider_type: inline::milvus
        config:
          db_path: /opt/app-root/src/.ogx/distributions/rh/milvus.db
          persistence:
            backend: kv_default
            namespace: vector_io::milvus
      responses:
      - provider_id: builtin
        provider_type: inline::builtin
        config:
          persistence:
            agent_state:
              backend: kv_default
              namespace: agents
            responses:
              backend: sql_default
              max_write_queue_size: 10000
              num_writers: 4
              table_name: responses
      files:
      - provider_id: meta-reference-files
        provider_type: inline::localfs
        config:
          metadata_store:
            backend: sql_default
            table_name: files_metadata
          storage_dir: /opt/app-root/src/.ogx/distributions/rh/files
      tool_runtime:
      - provider_id: file-search
        provider_type: inline::file-search
        config: {}
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
        config: {}
    metadata_store:
      type: sqlite
      db_path: /opt/app-root/src/.ogx/distributions/rh/inference_store.db
    storage:
      backends:
        kv_default:
          db_path: /opt/app-root/src/.ogx/distributions/rh/kvstore.db
          type: kv_sqlite
        sql_default:
          db_path: /opt/app-root/src/.ogx/distributions/rh/sql_store.db
          type: sql_sqlite
      stores:
        conversations:
          backend: sql_default
          table_name: openai_conversations
        inference:
          backend: sql_default
          table_name: inference_store
        metadata:
          backend: kv_default
          namespace: registry
    vector_stores:
      default_provider_id: milvus
      default_embedding_model:
        provider_id: sentence-transformers
        model_id: ibm-granite/granite-embedding-125m-english
    registered_resources:
      models:
      - provider_id: sentence-transformers
        model_id: sentence-transformers/ibm-granite/granite-embedding-125m-english
        provider_model_id: ibm-granite/granite-embedding-125m-english
        model_type: embedding
        metadata:
          embedding_dimension: 768
      - provider_id: vllm-inference-1
        model_id: llama-3-8b
        model_type: llm
        metadata: {}
      shields: []
      vector_stores: []
      datasets: []
      scoring_fns: []
      benchmarks: []
    server:
      port: 8321
---
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: lsd-genai-playground
  namespace: maas-models
  annotations:
    openshift.io/display-name: lsd-genai-playground
  labels:
    opendatahub.io/dashboard: "true"
spec:
  distribution:
    name: rh    # was "rh-dev" in the initially-captured live example; the operator now
                # emits "spec.distribution.name \"rh-dev\" is deprecated, use \"rh\" instead"
  network:
    port: 8321
  overrideConfig:
    name: llama-stack-config
    key: config.yaml
  workload:
    replicas: 1
    overrides:
      command:
      - /bin/sh
      - -c
      - ogx run /etc/ogx/config.yaml --insecure
      env:
      - name: VLLM_TLS_VERIFY
        value: "false"
      - name: VLLM_API_TOKEN_1
        value: fake
      - name: VLLM_MAX_TOKENS_1
        value: "4096"
      - name: MILVUS_DB_PATH
        value: ~/.ogx/milvus.db
      - name: FMS_ORCHESTRATOR_URL
        value: http://localhost
      - name: OGX_CONFIG_DIR
        value: /opt/app-root/src/.ogx/distributions/rh/
      resources:
        requests:
          cpu: 250m
          memory: 500Mi
        limits:
          cpu: "2"
          memory: 12Gi
