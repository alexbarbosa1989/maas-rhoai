# Gateway API Gateway for MaaS model endpoints.
# The maas-controller's default-tenant expects this exact name/namespace:
#   openshift-ingress/maas-default-gateway
# allowedRoutes: Selector — only namespaces labeled maas-gateway-access=true may attach
# HTTPRoutes. Using "from: All" here lets any namespace on the cluster attach a route and
# hijack MaaS traffic via Gateway API's Exact-beats-PathPrefix conflict resolution (see
# access.redhat.com/solutions/7145755). setup-maas.sh labels the required namespaces before
# applying this manifest — see configure_maas_gateway() and create_model_namespace().
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/part-of: maas
  annotations:
    # Prevents the ODH Model Controller from overriding MaaS-managed authorization policies.
    opendatahub.io/managed: "false"
    # Enables TLS communication between the Gateway and Authorino (MaaS controller creates
    # an EnvoyFilter to configure the Envoy proxy accordingly).
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  gatewayClassName: data-science-gateway-class
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: maas-default-gateway-config
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            maas-gateway-access: "true"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: maas-default-gateway-service-tls
