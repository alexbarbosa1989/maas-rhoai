# OCP Route that exposes the MaaS Envoy gateway to external clients.
#
# The maas-ui dashboard sidecar auto-discovers the MaaS API URL as
# https://maas.<apps-domain>/maas-api — this Route provides that endpoint.
# Without it the dashboard "Error loading components" error is shown because
# the maas-ui cannot reach the MaaS API to list API keys.
#
# The reencrypt termination mode mirrors the platform gateway route
# (openshift-ingress/data-science-gateway). The OCP Router re-encrypts to
# the Envoy pod using the cluster service CA; no explicit destCAcert needed.
#
# NOTE: the host field is templated — setup-maas.sh substitutes APPS_DOMAIN
# before applying. Do not apply this file directly with oc apply.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/part-of: maas
spec:
  host: maas.APPS_DOMAIN_PLACEHOLDER
  to:
    kind: Service
    name: maas-default-gateway-data-science-gateway-class
    weight: 100
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
