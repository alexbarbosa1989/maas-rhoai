# RateLimitPolicy — rate-limits inference requests per authenticated user.
# TokenRateLimitPolicy (also from RHCL) can enforce LLM token quotas if the
# serving runtime exposes token-usage headers.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: llama-3-8b-rate-limit
  namespace: maas-models
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llama-3-8b
  limits:
    per-user-rps:
      rates:
      - limit: 10
        window: 10s
      counters:
      - expression: auth.identity.user.username
    global-rps:
      rates:
      - limit: 100
        window: 10s
