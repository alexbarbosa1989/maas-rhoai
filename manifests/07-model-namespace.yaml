# Namespace where MaaS LLM models are deployed by the platform team.
# The label opendatahub.io/dashboard: "true" makes it visible in the RHOAI dashboard.
# The label maas.opendatahub.io/gateway-access: "true" is required for LLMInferenceService
# HTTPRoutes here to attach to maas-default-gateway (see 07-gateway.yaml.tmpl's
# allowedRoutes.namespaces.selector).
apiVersion: v1
kind: Namespace
metadata:
  name: maas-models
  labels:
    opendatahub.io/dashboard: "true"
    kubernetes.io/metadata.name: maas-models
    maas.opendatahub.io/gateway-access: "true"
